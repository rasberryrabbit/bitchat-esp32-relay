; platformio.ini - PlatformIO build configuration for bitchat-ESP32-relay
;
; 지원 보드:
;   - esp32dev  : ESP32 클래식 (ESP-WROOM-32, DevKitC V4, 240MHz 듀얼코어 Xtensa)
;   - esp32c3   : ESP32-C3 (RISC-V 싱글코어 160MHz, BLE 5.0, WiFi 4, 400KB SRAM)
;   - heltec_v2 : Heltec WiFi LoRa 32 V2 / TTGO LoRa32 V1.x (LED=25, BAT_ADC=13)
;   - t-beam    : TTGO T-Beam V1.x (AXP192 PMU 경유 - LED/ADC 비활성)
;
; 빌드 예시:
;   pio run -e heltec_v2                  # Heltec V2 배터리 모드
;   pio run -t upload -e heltec_v2
;   pio device monitor -e heltec_v2
;
;   pio run -e t-beam                     # T-Beam 배터리 모드
;   pio run -t upload -e t-beam
;
;   pio run -e esp32dev                    # 일반 ESP32 DevKitC
;   pio run -e esp32c3                     # ESP32-C3 DevKitM-1

[platformio]
default_envs = esp32c3
src_dir = src

; 공통 설정 - 모든 env에서 상속
[env]
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600
build_type        = release
; 로컬에 캐시된 플랫폼 사용 (registry rate limit 우회)
platform          = espressif32@6.7.0
; 전원 모드 기본값 = 배터리+절전
;   USB 상시 전원으로 변경하려면 -DBC_POWER_USB_ALWAYS=1로 교체
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBC_LOG_LEVEL=2
    -DBOARD_HAS_PSRAM=0
    -DBC_POWER_BATTERY=1
    -std=gnu++17
;
; 파티션 테이블: partitions/no_ota_spiffs_1280.csv
;   - OTA 제거 (app1 슬롯 없음) → app0 확장 (2,688KB)
;   - SPIFFS 1280KB (1.25MB) - msg_store 792KB + 인증서 4KB + 블랙리스트 9KB + 여유 475KB
;   - NVS 24KB (자체 키/피어/카운터 + bat_ignore 플래그)
;   - coredump 64KB (크래시 분석)
;
; 설계 의도:
;   - OTA 미구현 → app1 1,280KB 절약을 app0 + SPIFFS로 재할당
;   - 블랙리스트는 SPIFFS 파일로 영속화 (NVS blob 4KB 한계 극복)
;     → pk 32→256개, ble 16→128개로 확장 가능해짐
;   - SPIFFS 1MB 중 블랙리스트는 9KB만 사용 → 1,015KB 여유
;   - bat_ignore 플래그는 NVS에 uint8_t로 저장, 'bat ignore on/off' 명령으로 토글

; ----- ESP32 클래식 (ESP-WROOM-32) -----
[env:esp32dev]
platform          = ${env.platform}
board             = esp32dev
board_build.partitions = partitions/no_ota_spiffs_1280.csv
board_build.f_cpu = 240000000L
build_flags       = ${env.build_flags} -DBOARD_VARIANT_ESP32=1
; OTA 업데이트 (선택 - 향후 확장, 그 때 default.csv로 복귀)
; upload_protocol = espota
; upload_port = 192.168.1.100

; ----- ESP32-C3 (RISC-V, BLE 5.0) -----
; board = esp32-c3-devkitm-1 (PlatformIO 6.x 정식 board ID)
; 만약 더 작은 폼펙터(Seeed XIAO ESP32C3)를 쓰면 board = seeed_xiao_esp32c3
[env:esp32c3]
platform          = ${env.platform}
board             = esp32-c3-devkitm-1
board_build.partitions = partitions/no_ota_spiffs_1280.csv
board_build.f_cpu = 160000000L
build_flags       = ${env.build_flags} -DBOARD_VARIANT_ESP32C3=1
upload_protocol    = esptool
; USB CDC 보드(예: Seeed XIAO ESP32C3)는 위 board 줄을 seeed_xiao_esp32c3로 교체

; ----- ESP32-S3 (Xtensa LX7 듀얼코어, BLE 5.0, USB-OTG) -----
; ESP32-S3-DevKitC-1 (8MB Flash) - WiFi 4 + BLE 5.0 + USB OTG
[env:esp32s3]
platform          = ${env.platform}
board             = esp32-s3-devkitc-1
board_build.partitions = partitions/no_ota_spiffs_1280.csv
board_build.f_cpu = 240000000L
build_flags       = ${env.build_flags} -DBOARD_VARIANT_ESP32S3=1
upload_protocol    = esptool
; S3는 USB-OTG 내장이라 upload_protocol = esp-builtin으로도 가능 (USB CDC)

; ----- ESP32 클래식 + USB 상시 전원 (배터리 모드 비활성, 이전 동작) -----
[env:esp32dev-usb]
platform          = ${env.platform}
board             = esp32dev
board_build.partitions = partitions/no_ota_spiffs_1280.csv
board_build.f_cpu = 240000000L
build_flags       =
    -DCORE_DEBUG_LEVEL=1
    -DBC_LOG_LEVEL=2
    -DBOARD_HAS_PSRAM=0
    -DBOARD_VARIANT_ESP32=1
    -DBC_POWER_USB_ALWAYS=1
    -std=gnu++17

; ----- ESP32-C3 + USB 상시 전원 -----
[env:esp32c3-usb]
platform          = ${env.platform}
board             = esp32-c3-devkitm-1
board_build.partitions = partitions/no_ota_spiffs_1280.csv
board_build.f_cpu = 160000000L
build_flags       =
    -DCORE_DEBUG_LEVEL=1
    -DBC_LOG_LEVEL=2
    -DBOARD_HAS_PSRAM=0
    -DBOARD_VARIANT_ESP32C3=1
    -DBC_POWER_USB_ALWAYS=1
    -std=gnu++17
upload_protocol    = esptool

; ============================================================
; LoRa 통합 보드 전용 환경 (Heltec / TTGO)
; ============================================================
;
; Heltec WiFi LoRa 32 V2 / TTGO LoRa32 V1.x:
;   - ESP32 classic + SX1276 (433/868/915MHz)
;   - 온보드 LED:        GPIO 25 (Heltec 공식 pinout 확인)
;   - 배터리 전압 분배:  GPIO 13 (ADC2_CH4) - WiFi 켜지면 사용 불가
;     → BLE-only 모드에서만 유효, WiFi bridge 사용 시 무효
;   - LoRa 자동 감지 핀: SCK=5 MISO=19 MOSI=27 CS=18 RST=14 IRQ=26
;
; TTGO T-Beam V1.x:
;   - ESP32 classic + SX1276 + AXP192 PMU + GPS 옵션
;   - 온보드 LED:        AXP192 PMU 경유 (I2C addr 0x34) - GPIO 직접 제어 불가
;                      → BC_LED_PIN=255 (LED 비활성)
;   - 배터리 전압:       AXP192 PMU 경유 (I2C) - GPIO ADC로 읽기 불가
;                      → BC_BATTERY_ADC_PIN=255 (ADC 비활성)
;                      (정확한 배터리 측정은 AXP192 I2C 드라이버 추가 필요, TODO)
;   - LoRa 자동 감지 핀: SCK=5 MISO=19 MOSI=27 CS=18 RST=23 IRQ=26

; ----- Heltec WiFi LoRa 32 V2 / TTGO LoRa32 V1.x -----
[env:heltec_v2]
platform          = ${env.platform}
board             = esp32dev
board_build.partitions = partitions/no_ota_spiffs_1280.csv
board_build.f_cpu = 240000000L
build_flags       =
    -DCORE_DEBUG_LEVEL=1
    -DBC_LOG_LEVEL=2
    -DBOARD_HAS_PSRAM=0
    -DBOARD_VARIANT_ESP32=1
    -DBC_POWER_BATTERY=1
    -DBC_LED_PIN=25
    -DBC_BATTERY_ADC_PIN=13
    -std=gnu++17
upload_protocol    = esptool
; 주의: GPIO 13은 ADC2라서 WiFi 활성화 시 측정 불가.
;       BLE-only 운영 시에만 배터리 전압이 정상 측정됨.

; ----- Heltec V2 + USB 상시 전원 -----
[env:heltec_v2-usb]
platform          = ${env.platform}
board             = esp32dev
board_build.partitions = partitions/no_ota_spiffs_1280.csv
board_build.f_cpu = 240000000L
build_flags       =
    -DCORE_DEBUG_LEVEL=1
    -DBC_LOG_LEVEL=2
    -DBOARD_HAS_PSRAM=0
    -DBOARD_VARIANT_ESP32=1
    -DBC_POWER_USB_ALWAYS=1
    -DBC_LED_PIN=25
    -DBC_BATTERY_ADC_PIN=255
    -std=gnu++17
upload_protocol    = esptool

; ----- TTGO T-Beam V1.x -----
[env:t-beam]
platform          = ${env.platform}
board             = esp32dev
board_build.partitions = partitions/no_ota_spiffs_1280.csv
board_build.f_cpu = 240000000L
build_flags       =
    -DCORE_DEBUG_LEVEL=1
    -DBC_LOG_LEVEL=2
    -DBOARD_HAS_PSRAM=0
    -DBOARD_VARIANT_ESP32=1
    -DBC_POWER_BATTERY=1
    -DBC_LED_PIN=255
    -DBC_BATTERY_ADC_PIN=255
    -std=gnu++17
upload_protocol    = esptool
; 주의: T-Beam V1.x는 배터리/LED 모두 AXP192 PMU (I2C) 경유.
;       정확한 배터리 측정 + LED 제어를 원하면 AXP192 드라이버 추가 필요.

; ----- TTGO T-Beam V1.x + USB 상시 전원 -----
[env:t-beam-usb]
platform          = ${env.platform}
board             = esp32dev
board_build.partitions = partitions/no_ota_spiffs_1280.csv
board_build.f_cpu = 240000000L
build_flags       =
    -DCORE_DEBUG_LEVEL=1
    -DBC_LOG_LEVEL=2
    -DBOARD_HAS_PSRAM=0
    -DBOARD_VARIANT_ESP32=1
    -DBC_POWER_USB_ALWAYS=1
    -DBC_LED_PIN=255
    -DBC_BATTERY_ADC_PIN=255
    -std=gnu++17
upload_protocol    = esptool
