; platformio.ini - PlatformIO build configuration for bitchat-ESP32-relay
;
; 지원 보드 (2종):
;   - esp32dev  : ESP32 클래식 (ESP-WROOM-32, DevKitC V4, 240MHz 듀얼코어 Xtensa)
;   - esp32c3   : ESP32-C3 (RISC-V 싱글코어 160MHz, BLE 5.0, WiFi 4, 400KB SRAM)
;
; 빌드 (ESP32 클래식):
;   pio run -e esp32dev
;   pio run -t upload -e esp32dev
;   pio device monitor -e esp32dev
;
; 빌드 (ESP32-C3):
;   pio run -e esp32c3
;   pio run -t upload -e esp32c3
;   pio device monitor -e esp32c3

[platformio]
default_envs = esp32c3
src_dir = src

; 공통 설정 - 모든 env에서 상속
[env]
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600
build_type        = release
; 로컬에 캐시된 플랫폼 사용 (registry rate limit 우회)
platform          = file:///home/z/.platformio/platforms/espressif32
; 전원 모드 기본값 = 배터리+절전
;   USB 상시 전원으로 변경하려면 -DBC_POWER_USB_ALWAYS=1로 교체
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBC_LOG_LEVEL=3
    -DBOARD_HAS_PSRAM=0
    -DBC_POWER_BATTERY=1
    -std=gnu++17

; ----- ESP32 클래식 (ESP-WROOM-32) -----
[env:esp32dev]
platform          = ${env.platform}
board             = esp32dev
board_build.partitions = default.csv
board_build.f_cpu = 240000000L
build_flags       = ${env.build_flags} -DBOARD_VARIANT_ESP32=1
; OTA 업데이트 (선택 - 향후 확장)
; upload_protocol = espota
; upload_port = 192.168.1.100

; ----- ESP32-C3 (RISC-V, BLE 5.0) -----
; board = esp32-c3-devkitm-1 (PlatformIO 6.x 정식 board ID)
; 만약 더 작은 폼펙터(Seeed XIAO ESP32C3)를 쓰면 board = seeed_xiao_esp32c3
[env:esp32c3]
platform          = ${env.platform}
board             = esp32-c3-devkitm-1
board_build.partitions = default.csv
board_build.f_cpu = 160000000L
build_flags       = ${env.build_flags} -DBOARD_VARIANT_ESP32C3=1
upload_protocol    = esptool
; USB CDC 보드(예: Seeed XIAO ESP32C3)는 위 board 줄을 seeed_xiao_esp32c3로 교체

; ----- ESP32-S3 (Xtensa LX7 듀얼코어, BLE 5.0, USB-OTG) -----
; ESP32-S3-DevKitC-1 (8MB Flash) - WiFi 4 + BLE 5.0 + USB OTG
[env:esp32s3]
platform          = ${env.platform}
board             = esp32-s3-devkitc-1
board_build.partitions = default.csv
board_build.f_cpu = 240000000L
build_flags       = ${env.build_flags} -DBOARD_VARIANT_ESP32S3=1
upload_protocol    = esptool
; S3는 USB-OTG 내장이라 upload_protocol = esp-builtin으로도 가능 (USB CDC)

; ----- ESP32 클래식 + USB 상시 전원 (배터리 모드 비활성, 이전 동작) -----
[env:esp32dev-usb]
platform          = ${env.platform}
board             = esp32dev
board_build.partitions = default.csv
board_build.f_cpu = 240000000L
build_flags       =
    -DCORE_DEBUG_LEVEL=3
    -DBC_LOG_LEVEL=3
    -DBOARD_HAS_PSRAM=0
    -DBOARD_VARIANT_ESP32=1
    -DBC_POWER_USB_ALWAYS=1
    -std=gnu++17

; ----- ESP32-C3 + USB 상시 전원 -----
[env:esp32c3-usb]
platform          = ${env.platform}
board             = esp32-c3-devkitm-1
board_build.partitions = default.csv
board_build.f_cpu = 160000000L
build_flags       =
    -DCORE_DEBUG_LEVEL=3
    -DBC_LOG_LEVEL=3
    -DBOARD_HAS_PSRAM=0
    -DBOARD_VARIANT_ESP32C3=1
    -DBC_POWER_USB_ALWAYS=1
    -std=gnu++17
upload_protocol    = esptool
